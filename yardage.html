<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zion Hills Yardage Book</title>
  <meta name="robots" content="noindex">
  <!-- Source for yardage-book.pdf. Built from the hole guide in js/cart-content.js.
       To rebuild the PDF: open this page in Chrome/Edge → Print → Save as PDF
       (or run headless: msedge --headless --print-to-pdf=yardage-book.pdf yardage.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --mint: #e6f1e8; --mint-2: #d3e8d9; --deep: #10301e; --ink: #17201b; --ink-2: #4b5c52; --flame: #e8552e;
      --serif: "Instrument Serif", Georgia, serif; --sans: "Inter Tight", Inter, Arial, sans-serif; --mono: "IBM Plex Mono", monospace; }
    @page { size: 4.5in 7.5in; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #cfd8d2; color: var(--ink); font: 400 12px/1.5 Inter, Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { position: relative; width: 4.5in; height: 7.5in; margin: 16px auto; overflow: hidden; background: #fff; page-break-after: always; break-after: page; }
    @media print { body { background: none; } .page { margin: 0; box-shadow: none; } }
    .mono { font: 500 7.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; }

    /* cover */
    .cover { background: var(--deep); color: #fff; }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(6, 26, 15, .25), rgba(6, 26, 15, .1) 35%, rgba(6, 26, 15, .92) 78%); }
    .cover-in { position: absolute; z-index: 1; left: .4in; right: .4in; bottom: .45in; }
    .cover h1 { margin: 8px 0 10px; font: italic 400 52px/.92 var(--serif); letter-spacing: -.01em; }
    .cover p { margin: 0; font-size: 11.5px; color: rgba(255, 255, 255, .85); }
    .cover .stats { display: flex; gap: 18px; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .25); }
    .cover .stats b { display: block; font: 700 18px/1 var(--sans); }
    .cover .stats span { font: 500 7px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #ffb79f; }
    .brand { position: absolute; z-index: 1; top: .35in; left: .4in; right: .4in; display: flex; justify-content: space-between; color: #fff; }

    /* hole pages */
    .hole { padding: .38in .4in .3in; display: flex; flex-direction: column; background:
      repeating-linear-gradient(90deg, rgba(16, 48, 30, .035) 0 26px, transparent 26px 52px), var(--mint); }
    .hole .top { display: flex; justify-content: space-between; color: var(--ink-2); }
    .hole .head { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 18px; padding-bottom: 12px; border-bottom: 1.5px solid var(--deep); }
    .hole .no { font: italic 400 96px/.8 var(--serif); color: var(--deep); }
    .hole .no small { display: block; font: 500 8px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; font-style: normal; color: var(--ink-2); margin-bottom: 8px; }
    .chips { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .par { font: 700 18px/1 var(--sans); padding: 8px 13px; border-radius: 999px; background: var(--deep); color: #fff; }
    .hcp { font: 500 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
    .badge { align-self: flex-start; margin-top: 14px; padding: 5px 10px; border-radius: 999px; background: var(--flame); color: #fff; font: 600 10px/1.2 var(--sans); }
    .play { margin-top: 16px; }
    .play h3, .notes h3 { margin: 0 0 6px; font: 500 7.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--flame); }
    .play p { margin: 0; font-size: 12.5px; line-height: 1.55; }
    .notes { margin-top: auto; padding-top: 14px; }
    .notes .lines { height: 1.35in; background: repeating-linear-gradient(to bottom, transparent 0 25px, rgba(16, 48, 30, .22) 25px 26px); }
    .foot { margin-top: 12px; display: flex; justify-content: space-between; color: var(--ink-2); }
    .foot b { color: var(--deep); font-weight: 500; }

    /* back page */
    .back { background: var(--deep); color: #fff; padding: .5in .4in; display: flex; flex-direction: column; justify-content: flex-end; }
    .back h2 { margin: 8px 0 12px; font: italic 400 34px/1 var(--serif); }
    .back p { margin: 0 0 6px; font-size: 11.5px; color: rgba(255, 255, 255, .85); }
    .back .mono { color: #ffb79f; }
    .back a { color: #fff; }
  </style>
</head>
<body>
  <main id="book"></main>
  <script src="js/content.js"></script>
  <script src="js/cart-content.js"></script>
  <script>
    (function () {
      const C = window.CART, Z = window.ZION;
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const par = (a, b) => C.holes.slice(a, b).reduce((t, h) => t + h.par, 0);
      const aerial = "https://static.wixstatic.com/media/6c3b8b_3df8f334569d455cbd85b5cd421d4637~mv2.jpg/v1/fill/w_900,h_1500,al_c,q_80,enc_auto/zionhills.jpg";
      const pages = [`
        <section class="page cover">
          <img src="${aerial}" alt="">
          <div class="brand mono"><span>Zion Hills · Golf County</span><span>Kolar · Bangalore</span></div>
          <div class="cover-in">
            <p class="mono" style="color:#ffb79f">The course guide</p>
            <h1>Yardage<br>Book</h1>
            <p>Hole by hole: par, handicap and how to play every shot.</p>
            <div class="stats">
              <div><b>18</b><span>Holes</span></div>
              <div><b>${par(0, 18)}</b><span>Par</span></div>
              <div><b>A4</b><span>Bent Grass greens</span></div>
            </div>
          </div>
        </section>`];
      C.holes.forEach((h, i) => pages.push(`
        <section class="page hole">
          <div class="top mono"><span>Zion Hills Yardage Book</span><span>${i < 9 ? "Out" : "In"} · ${i + 1} / 18</span></div>
          <div class="head">
            <div class="no"><small>Hole</small>${i + 1}</div>
            <div class="chips"><span class="par">Par ${h.par}</span>${h.hcp ? `<span class="hcp">Handicap ${h.hcp}</span>` : ""}</div>
          </div>
          ${h.badge ? `<span class="badge">${esc(h.badge)}</span>` : ""}
          <div class="play"><h3>How to play it</h3><p>${esc(h.tip)}</p></div>
          <div class="notes"><h3>My notes</h3><div class="lines"></div></div>
          <div class="foot mono"><span>The only A4 Bent Grass greens in India</span><b>Zion Hills</b></div>
        </section>`));
      pages.push(`
        <section class="page back">
          <p class="mono">Enjoyed your round?</p>
          <h2>This could be your home course.</h2>
          <p>Over 150 homes beside these 18 holes are already lived in.</p>
          <p style="margin-top:14px">Call or WhatsApp <b>${esc(Z.contact.phone.replace(/^\+91/, "+91 ").replace(/(\d{5})(\d{5})$/, "$1 $2"))}</b></p>
          <p>${esc(Z.contact.email)} · <a href="https://www.zionhills.in">zionhills.in</a></p>
          <p>Live estate map: <a href="${esc(Z.brand.mapUrl)}">${esc(Z.brand.mapUrl.replace(/^https:\/\//, ""))}</a></p>
        </section>`);
      document.getElementById("book").innerHTML = pages.join("");
    })();
  </script>
</body>
</html>
