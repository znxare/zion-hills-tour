<body class="gating">
  <!-- 0. The ritual: sink the putt to enter -->
  <div class="gate film" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <!-- a real Zion Hills green: the camera rises out of the cup, you sink the putt, it falls back in -->
    <div class="g-scene" aria-hidden="true">
      <video class="g-film" muted playsinline preload="auto" disablepictureinpicture></video>
      <div class="g-still"></div>
      <div class="g-grade"></div>
      <div class="g-vig"></div>
    </div>
    <div class="g-grain" aria-hidden="true"></div>
    <div class="green" aria-hidden="true"><span class="cup"><i></i></span></div>
    <div class="gate-copy">
      <h1 id="gate-title"><em class="serif"></em><span></span></h1>
    </div>
    <p class="gate-msg" aria-live="polite"></p>
    <button class="ball" id="ball" aria-label="Putt the ball"><i></i></button>
    <p class="mono gate-hint"></p>
    <p class="mono gate-foot">The only A4 Bent Grass greens in India</p>
    <div class="g-intro" aria-hidden="true"><img src="images/zion-logo-white.svg" alt=""></div>
    <div class="g-black" aria-hidden="true"></div>
  </div>

  <main id="app"></main>

  <!-- Dock: always-on main ask -->
  <nav class="dock" aria-label="Quick actions">
    <a class="dock-round" id="dock-wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp Zion Hills">

    </a>
    <a class="dock-main" href="#after">See a home after your round</a>

    </button>
